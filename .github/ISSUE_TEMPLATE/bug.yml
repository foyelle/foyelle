name: Bug
description: Something in Foyelle doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: where
    attributes:
      label: Where
      description: The VM image (and its commit), the dev canvas (npm run dev), or something else.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, for example from `journalctl -u foyelle-harness`. Remove anything private first.
      render: text
