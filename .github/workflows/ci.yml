name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: a pull request that is ready to merge, tested as it will land on main.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests, patches and egress guard
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The pinned Hermes commit's pyproject needs a uv that reads its exclude-newer settings; this is
      # the version upstream's own tests.yml pins.
      - name: Install uv
        run: pip install "uv==0.12.13"

      - name: Policy plugin
        working-directory: harness/plugin
        run: uv run --group dev pytest -q

      - name: Apply helper
        working-directory: system/apply-helper
        run: |
          pip install pytest
          python -m pytest -q

      - name: Connectors
        working-directory: connectors
        run: uv run --group dev pytest -q

      - name: Canvas
        working-directory: canvas
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Harness patches apply to the pinned upstream
        run: scripts/harness-patches checkout

      - name: Egress guard
        run: python3 scripts/egress-guard

      - name: Upstream tests around the patches
        working-directory: .upstream/hermes-agent
        run: |
          uv sync --frozen --python 3.14 --group dev --group test
          HERMES_PYTHON=.venv/bin/python scripts/run_tests.sh -j 4 \
            tests/tools/test_mcp_surfaces.py tests/tui_gateway/contracts tests/hermes_cli/test_foyelle_required_plugins.py \
            tests/tools/test_mcp_tool.py \
            tests/hermes_cli/test_model_catalog.py tests/tools/test_managed_tool_gateway.py \
            tests/hermes_cli/test_shared_metrics_send_config.py tests/pm/test_artifact_mirror.py

  demo:
    name: Web demo in Chromium and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          (cd canvas && npm ci)
          scripts/deploy-site --dry-run
      # The README demo's steps (canvas/dev/record-demo.mjs) at a desktop's and a phone's size.
      - name: Drive the demo
        working-directory: canvas
        run: |
          npm i --no-save playwright-core@1.63.0
          npx --yes playwright@1.63.0 install --with-deps chromium webkit
          node demo/test.mjs --shots ../out/demo-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-screenshots
          path: out/demo-shots/
          if-no-files-found: ignore

  nix:
    name: Nix checks and VM tests
    # The OS image and the VM tests take about 25 minutes, so they run once a pull request is ready
    # to merge (in the merge queue), on main, and by hand. On a pull request's own pushes the job is
    # skipped, which a required check counts as passed: the merge queue is what holds main to them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            extra-platforms = aarch64-linux
            sandbox = true

      - name: Evaluate the aarch64 alpha image
        run: |
          nix eval --raw .#nixosConfigurations.alpha-vm-aarch64-linux.config.system.build.toplevel.drvPath
          echo
          # The encrypted (LUKS) disk image derivation evaluates; building it needs an aarch64 builder.
          nix eval --raw .#packages.aarch64-linux.vm-image.drvPath

      - name: Component checks
        run: |
          nix build -L --keep-going \
            .#checks.x86_64-linux.policy-plugin \
            .#checks.x86_64-linux.apply-helper \
            .#checks.x86_64-linux.egress-guard \
            .#checks.x86_64-linux.connectors \
            .#checks.x86_64-linux.canvas \
            .#checks.x86_64-linux.release-no-ssh \
            .#checks.x86_64-linux.config-merge

      - name: Harness package
        run: nix build -L .#packages.x86_64-linux.harness

      - name: "VM test: boot to the canvas (M1)"
        if: ${{ !cancelled() }}
        run: nix build -L .#checks.x86_64-linux.boot-canvas
      - name: "VM test: connector isolation (M3)"
        if: ${{ !cancelled() }}
        run: nix build -L .#checks.x86_64-linux.isolation
      - name: "VM test: surfaces, policy, audit and egress end to end (M2, M3)"
        if: ${{ !cancelled() }}
        run: nix build -L .#checks.x86_64-linux.end-to-end
      - name: "VM test: system changes, approval tokens and rollback (M4)"
        if: ${{ !cancelled() }}
        run: nix build -L .#checks.x86_64-linux.system-loop
      - name: "VM test: disk encryption and the passphrase prompt"
        if: ${{ !cancelled() }}
        run: nix build -L .#checks.x86_64-linux.disk-encryption

      - name: Screenshot of the canvas
        if: always()
        run: |
          mkdir -p artifacts
          for r in $(nix path-info .#checks.x86_64-linux.boot-canvas 2>/dev/null); do cp "$r"/*.png artifacts/ 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-test-screenshots
          path: artifacts/
          if-no-files-found: ignore
