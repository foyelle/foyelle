<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<style>
/* Foyelle's look for cards: warm paper, ink-edged buttons with a hard shadow, Nunito for words and
   Gochi Hand for titles (both installed with the canvas). The canvas passes its colours and font;
   these are the fallbacks. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, #ffffff);
  --bg2: var(--color-background-secondary, #f8efe1);
  --fg: var(--color-text-primary, #2a1e16);
  --fg2: var(--color-text-secondary, #6b5a4c);
  --border: var(--color-border-primary, #eadcc8);
  --accent: var(--color-text-info, #c2410c);
  --danger: var(--color-text-danger, #b3261e);
  --ok: var(--color-text-success, #2f7a3a);
  --warn: var(--color-text-warning, #8a5a00);
  --ring: var(--color-ring-primary, #ff8a3d);
  --flame: var(--color-background-info, #ff8a3d);
  --on-flame: var(--foyelle-on-primary, #2a1e16);
  --edge: var(--color-border-secondary, var(--fg));
  --edge-w: var(--border-width-regular, 2px);
  --lift: var(--shadow-sm, 0 2px 0 var(--edge));
  --sun: var(--foyelle-highlight, #ffd23f);
  --on-sun: var(--foyelle-on-highlight, #2a1e16);
  --hot: var(--foyelle-alert, #d6331f);
  --on-hot: var(--foyelle-on-alert, #ffffff);
  --pill: var(--border-radius-full, 999px);
  --tilt: var(--foyelle-tilt, 1deg);
  --radius: var(--border-radius-md, 14px);
  --font: var(--font-sans, "Nunito", "Avenir Next", "Noto Sans", "Noto Sans CJK SC", system-ui, sans-serif);
  --hand: var(--foyelle-display, "Gochi Hand", "Noteworthy", "Bradley Hand", var(--font));
  --hand-weight: var(--foyelle-display-weight, 400);
  --hand-scale: var(--foyelle-display-scale, 1);
  --mono: var(--font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-background-primary, #2c231c);
    --bg2: var(--color-background-secondary, #352a21);
    --fg: var(--color-text-primary, #f6ecdf);
    --fg2: var(--color-text-secondary, #cbb9a4);
    --border: var(--color-border-primary, #44372c);
    --accent: var(--color-text-info, #ffa25f);
    --danger: var(--color-text-danger, #ff9c8a);
    --ok: var(--color-text-success, #9fd18e);
    --warn: var(--color-text-warning, #f0c96b);
    --ring: var(--color-ring-primary, #ff8a3d);
    --lift: 0 2px 0 rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--color-background-primary, #2c231c);
  --bg2: var(--color-background-secondary, #352a21);
  --fg: var(--color-text-primary, #f6ecdf);
  --fg2: var(--color-text-secondary, #cbb9a4);
  --border: var(--color-border-primary, #44372c);
  --accent: var(--color-text-info, #ffa25f);
  --danger: var(--color-text-danger, #ff9c8a);
  --ok: var(--color-text-success, #9fd18e);
  --warn: var(--color-text-warning, #f0c96b);
  --ring: var(--color-ring-primary, #ff8a3d);
  --lift: 0 2px 0 rgba(0, 0, 0, .55);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14.5px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { padding: 12px 16px 16px; }
h1 { font: var(--hand-weight) calc(26px * var(--hand-scale))/1.1 var(--hand); margin: 0 0 10px; }
h2 { font-size: 14.5px; margin: 16px 0 6px; font-weight: 800; }
p { margin: 6px 0; }
a, .link { color: var(--accent); }
.muted { color: var(--fg2); }
.mono, pre, code, textarea.mono { font-family: var(--mono); font-size: 12.5px; }
pre { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 60vh; margin: 6px 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
.spacer { flex: 1; }
button, input, select, textarea {
  font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 5px 11px;
}
button {
  cursor: pointer; font-weight: 800; border: var(--edge-w) solid var(--edge); border-radius: var(--pill); padding: 5px 14px;
  box-shadow: var(--lift); transition: transform .12s ease, box-shadow .12s ease;
}
button:hover:not([disabled]) { transform: translateY(-1px); }
button:active:not([disabled]) { transform: translateY(2px); box-shadow: none; }
button[aria-pressed="true"], button.on { background: var(--sun); color: var(--on-sun); }
button.primary { background: var(--flame); color: var(--on-flame); }
input:focus, select:focus, textarea:focus { border-color: var(--edge); outline: none; }
button.danger { color: var(--danger); }
button[disabled] { opacity: .5; cursor: default; }
button.linklike { background: none; border: none; padding: 0; color: var(--accent); text-align: left; box-shadow: none; border-radius: 0; font-weight: 700; }
button.linklike:hover, button.linklike:active { transform: none; box-shadow: none; text-decoration: underline wavy var(--flame); text-underline-offset: 3px; }
/* Bevelled themes (Millennium): buttons shaded light to dark over their colour, plain-weight words, a glow
   inside on hover and sunken when pressed, instead of lifting. Other themes don't set --foyelle-bevel and skip this. */
@container style(--foyelle-bevel: on) {
  button:not(.linklike) { background-image: var(--foyelle-shade); box-shadow: none; font-weight: 400; }
  button:not(.linklike):hover:not([disabled]) { transform: none; box-shadow: var(--foyelle-glow); }
  button:not(.linklike):active:not([disabled]) { transform: none; background-image: var(--foyelle-shade-pressed); }
}
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
textarea { width: 100%; min-height: 8em; resize: vertical; }
label { display: block; margin: 12px 0 3px; color: var(--fg2); font-size: 12.5px; font-weight: 700; }
input[type=text], input[type=search], input:not([type]) { width: 100%; }
.toolbar input[type=search], .toolbar input[type=text] { width: auto; flex: 1; min-width: 10em; }
.toolbar label { display: inline-flex; gap: 6px; align-items: center; margin: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1.5px dashed var(--border); vertical-align: top; }
th { color: var(--fg2); font-weight: 800; font-size: 12.5px; }
tr.selected td { background: var(--bg2); }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 12px 0; border-bottom: 1.5px dashed var(--border); }
.card { border: 1.5px solid var(--border); border-radius: 18px; padding: 12px 14px; margin: 12px 0; background: var(--bg); }
.badge { display: inline-block; padding: 1px 8px; border-radius: var(--pill); font-size: 12px; font-weight: 800; background: var(--bg2); color: var(--fg2); }
.badge.ok { color: var(--ok); }
.badge.warn { background: var(--sun); color: var(--on-sun); }
.badge.bad { background: var(--hot); color: var(--on-hot); transform: rotate(calc(var(--tilt) * -3)); }
.status { min-height: 1.4em; font-size: 12.5px; color: var(--fg2); margin: 6px 0; }
.status.error { color: var(--danger); }
.status.busy::before { content: "… "; }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.grid dt { color: var(--fg2); }
.grid dd { margin: 0; overflow-wrap: anywhere; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.pre-line { white-space: pre-line; }
.toolbar h1 { margin: 0; }
</style>
<script>
/* Foyelle view runtime: the View side of MCP Apps (SEP-1865), protocol 2026-01-26.
 * JSON-RPC 2.0 over postMessage with window.parent. No network, no dependencies.
 * Untrusted text is always rendered with textContent (see h()). */
(function () {
  "use strict";
  var PROTOCOL_VERSION = "2026-01-26";
  var parent = window.parent;
  var nextId = 1;
  var pending = new Map();

  var view = {
    hostContext: {},
    hostCapabilities: {},
    hostInfo: null,
    toolInput: null,
    onToolInput: null,
    onToolInputPartial: null,
    onToolResult: null,
    onToolCancelled: null,
    onHostContext: null,
    onTeardown: null,
    onChanged: null,
  };

  function post(msg) { parent.postMessage(msg, "*"); }

  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending.set(id, { resolve: resolve, reject: reject });
      post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  function notify(method, params) {
    post({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function respond(id, result) { post({ jsonrpc: "2.0", id: id, result: result || {} }); }

  function respondError(id, code, message) {
    post({ jsonrpc: "2.0", id: id, error: { code: code, message: message } });
  }

  function call(fn, arg) {
    if (typeof fn !== "function") return;
    try { fn(arg); } catch (e) { console.error(e); }
  }

  function applyHostContext(ctx) {
    if (!ctx) return;
    Object.assign(view.hostContext, ctx);
    var root = document.documentElement;
    if (ctx.theme === "light" || ctx.theme === "dark") root.setAttribute("data-theme", ctx.theme);
    // The spec's style variables, then Foyelle's own extras (display font, highlight colours).
    [ctx.styles && ctx.styles.variables, ctx.foyelle && ctx.foyelle.styles].forEach(function (vars) {
      if (!vars) return;
      Object.keys(vars).forEach(function (k) {
        if (/^--[a-z0-9-]+$/.test(k) && typeof vars[k] === "string") root.style.setProperty(k, vars[k]);
      });
    });
    if (ctx.locale) root.lang = ctx.locale;
  }

  function onMessage(event) {
    if (event.source !== parent) return;
    var m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method === undefined && m.id !== undefined) {
      var p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) {
        var err = new Error(m.error.message || "request failed");
        err.code = m.error.code;
        err.data = m.error.data;
        p.reject(err);
      } else {
        p.resolve(m.result);
      }
      return;
    }
    var params = m.params || {};
    if (m.id !== undefined) {
      switch (m.method) {
        case "ping": respond(m.id, {}); return;
        case "ui/resource-teardown": call(view.onTeardown, params); respond(m.id, {}); return;
        default: respondError(m.id, -32601, "Method not found: " + m.method); return;
      }
    }
    switch (m.method) {
      case "ui/notifications/tool-input":
        view.toolInput = params.arguments || {};
        call(view.onToolInput, view.toolInput);
        break;
      case "ui/notifications/tool-input-partial": call(view.onToolInputPartial, params.arguments || {}); break;
      case "ui/notifications/tool-result": call(view.onToolResult, params); break;
      case "ui/notifications/tool-cancelled": call(view.onToolCancelled, params); break;
      case "ui/notifications/host-context-changed":
        applyHostContext(params);
        call(view.onHostContext, view.hostContext);
        break;
      // Foyelle: the agent changed this helper's data (added a task, saved a file): reload.
      case "foyelle/notifications/changed": call(view.onChanged, params); break;
      default: break;
    }
  }

  window.addEventListener("message", onMessage);

  var sizeTimer = 0;
  function reportSize() {
    cancelAnimationFrame(sizeTimer);
    sizeTimer = requestAnimationFrame(function () {
      var el = document.documentElement;
      notify("ui/notifications/size-changed", { width: Math.ceil(el.scrollWidth), height: Math.ceil(el.scrollHeight) });
    });
  }

  view.connect = function (appInfo) {
    return request("ui/initialize", {
      appInfo: appInfo,
      appCapabilities: {},
      protocolVersion: PROTOCOL_VERSION,
    }).then(function (result) {
      result = result || {};
      view.hostInfo = result.hostInfo || null;
      view.hostCapabilities = result.hostCapabilities || {};
      applyHostContext(result.hostContext || {});
      notify("ui/notifications/initialized", {});
      if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.body);
      reportSize();
      return result;
    });
  };

  /** Call a tool on this view's own MCP server, through the host (policy applies). */
  view.callTool = function (name, args) {
    return request("tools/call", { name: name, arguments: args || {} });
  };
  view.readResource = function (uri) { return request("resources/read", { uri: uri }); };
  /** Post a user message into the chat. */
  view.sendMessage = function (text) {
    return request("ui/message", { role: "user", content: [{ type: "text", text: text }] });
  };
  view.openLink = function (url) { return request("ui/open-link", { url: url }); };
  view.updateModelContext = function (text) {
    return request("ui/update-model-context", { content: [{ type: "text", text: text }] });
  };
  /** Ask the host to save a text file for the user (ui/download-file). */
  view.downloadFile = function (filename, text, mimeType) {
    return request("ui/download-file", {
      contents: [{ type: "resource", resource: { uri: "file:///" + encodeURIComponent(filename), mimeType: mimeType || "text/plain", text: text } }],
    });
  };
  view.requestTeardown = function () { notify("ui/notifications/request-teardown", {}); };

  /** structuredContent of a CallToolResult, or the JSON in its first text block. */
  view.data = function (result) {
    if (!result) return null;
    if (result.structuredContent) return result.structuredContent;
    var block = (result.content || []).find(function (c) { return c.type === "text"; });
    if (!block) return null;
    try { return JSON.parse(block.text); } catch (e) { return { text: block.text }; }
  };
  view.errorText = function (result) {
    if (!result || !result.isError) return null;
    var block = (result.content || []).find(function (c) { return c.type === "text"; });
    return block ? block.text : "The tool returned an error.";
  };

  /* ---- small DOM helpers (textContent only; never innerHTML with data) ---- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : String(v));
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, child) {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(function (c) { append(el, c); }); return; }
    el.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function $(sel) { return document.querySelector(sel); }

  function status(text, kind) {
    var el = $("#status");
    if (!el) return;
    el.textContent = text || "";
    el.className = "status" + (kind ? " " + kind : "");
  }

  function fmtBytes(n) {
    if (n === null || n === undefined) return "";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i ? n.toFixed(1) : String(n)) + " " + u[i];
  }
  function fmtDate(value, opts) {
    if (!value) return "";
    var d = new Date(typeof value === "number" ? value * 1000 : value);
    if (isNaN(d)) return String(value);
    opts = Object.assign({}, opts || { dateStyle: "medium", timeStyle: "short" });
    if (!opts.timeZone && view.hostContext.timeZone) opts.timeZone = view.hostContext.timeZone;
    try { return d.toLocaleString(view.hostContext.locale || undefined, opts); }
    catch (e) { return d.toISOString(); }
  }

  /**
   * Run a tool, show progress and errors in #status, resolve with its data
   * (or null on error).
   */
  function run(name, args, busy) {
    if (busy !== null) status(busy || "Working…", "busy");
    return view.callTool(name, args).then(function (result) {
      var err = view.errorText(result);
      if (err) { status(err, "error"); return null; }
      if (busy !== null) status("");
      return view.data(result);
    }, function (e) {
      status((e && e.message) || "Request failed", "error");
      return null;
    });
  }

  /**
   * Start a view. options: {name, render(data, args), load(), refresh()}. refresh, when given,
   * runs when the agent changes this helper's data (several changes in a row run it once).
   * When the host opened the view for a tool call, the tool result is
   * rendered; otherwise (opened from the surface list) load() fetches data.
   */
  view.start = function (options) {
    var gotResult = false, refreshTimer = 0;
    if (options.refresh) {
      view.onChanged = function () {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(function () { options.refresh(); }, 400);
      };
    }
    view.onToolResult = function (result) {
      gotResult = true;
      var err = view.errorText(result);
      if (err) { status(err, "error"); return; }
      status("");
      // A view without render (one that loads its own data) loads when opened by a tool too.
      if (options.render) options.render(view.data(result), view.toolInput || {});
      else if (options.load) options.load();
    };
    return view.connect({ name: options.name, version: "0.1.0" }).then(function () {
      // A tool-driven open gets tool-input then tool-result; give them a moment.
      var toolDriven = !!view.hostContext.toolInfo || view.toolInput !== null;
      setTimeout(function () {
        if (!gotResult && view.toolInput === null && options.load) options.load();
      }, toolDriven ? 1500 : 0);
    }, function (e) {
      status("Could not connect to the host: " + ((e && e.message) || e), "error");
    });
  };

  // Surfaces run in a sandbox without allow-forms, where the browser never fires "submit". Wire
  // a form's submit button and Enter in its single-line fields to the handler instead.
  view.onSubmit = function (form, handler) {
    var fire = function (e) { if (e) e.preventDefault(); handler(); };
    form.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function (b) {
      b.addEventListener("click", fire);
    });
    form.querySelectorAll("input").forEach(function (input) {
      if (input.type === "submit" || input.type === "button" || input.type === "checkbox") return;
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") fire(e); });
    });
    form.addEventListener("submit", fire);
  };

  view.h = h;
  view.clear = clear;
  view.$ = $;
  view.status = status;
  view.run = run;
  view.fmtBytes = fmtBytes;
  view.fmtDate = fmtDate;
  window.FoyelleView = view;
})();
</script>
</head>
<body>
<style>
  #editor { width: 100%; min-height: 24em; box-sizing: border-box; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #image { max-width: 100%; max-height: 60vh; display: block; margin: 8px 0; background: repeating-conic-gradient(#8882 0% 25%, transparent 0% 50%) 0 0 / 16px 16px; }
  #versions li { display: flex; gap: 8px; align-items: center; padding: 2px 0; }
  #version-note { margin: 4px 0; }
</style>
<main>
  <div class="toolbar">
    <h1>Files</h1><span class="spacer"></span>
    <button id="up" type="button" aria-label="Up one folder">Up</button>
    <button id="refresh" type="button">Refresh</button>
    <button id="undo" type="button">Undo last change</button>
  </div>
  <form id="search" class="toolbar" role="search">
    <input id="q" type="search" placeholder="Find by name" aria-label="File name">
    <input id="c" type="search" placeholder="…or containing text" aria-label="Containing text">
    <button type="submit">Search</button>
  </form>
  <nav id="crumbs" class="toolbar" aria-label="Current folder"></nav>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="split">
    <table aria-label="Folder contents">
      <thead><tr><th scope="col">Name</th><th scope="col">Size</th><th scope="col">Modified</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <section aria-label="Preview">
      <div class="toolbar"><strong id="pname" class="ellipsis"></strong><span class="spacer"></span>
        <button id="edit" type="button" hidden>Edit</button>
        <button id="save" type="button" class="primary" hidden>Save</button>
        <button id="cancel" type="button" hidden>Cancel</button>
        <button id="show-versions" type="button" hidden>Versions</button>
        <button id="trash" type="button" class="danger" hidden>Move to trash</button></div>
      <p id="version-note" class="muted" hidden></p>
      <img id="image" alt="" hidden>
      <pre id="preview" tabindex="0" hidden></pre>
      <textarea id="editor" spellcheck="false" aria-label="File content" hidden></textarea>
      <p id="pinfo" class="muted"></p>
      <div id="versions-box" hidden>
        <h2>Versions</h2>
        <p class="muted">Every save keeps the content it replaced. Restoring a version keeps the current one too.</p>
        <ul id="versions" class="list"></ul>
      </div>
    </section>
  </div>
</main>
<script>
(function () {
  var V = FoyelleView, h = V.h;
  var cwd = "", selected = null, readOnly = false, current = null;
  var IMAGE = /\.(png|jpe?g|gif|webp|svg)$/i;

  function crumbs() {
    var nav = V.clear(V.$("#crumbs")), parts = cwd ? cwd.split("/") : [];
    nav.appendChild(h("button", { type: "button", class: "linklike", text: "All folders", onclick: function () { open(""); } }));
    parts.forEach(function (p, i) {
      nav.append(" / ", h("button", { type: "button", class: "linklike", text: p, "aria-current": i === parts.length - 1 ? "page" : null,
        onclick: function () { open(parts.slice(0, i + 1).join("/")); } }));
    });
    V.$("#up").disabled = !cwd;
  }

  function row(e) {
    var isDir = e.type === "dir" || e.type === "root";
    var label = e.type === "root" ? e.name + "/" + (e.read_only ? " (read-only)" : "") : e.name + (isDir ? "/" : "");
    var btn = h("button", { type: "button", class: "linklike", text: label, onclick: function () { isDir ? open(e.path) : preview(e); } });
    var tr = h("tr", null,
      h("td", null, btn, e.matches ? h("div", { class: "muted mono pre-line", text: e.matches.map(function (m) { return m.line + ": " + m.text; }).join("\n") }) : null),
      h("td", { text: e.type === "file" ? V.fmtBytes(e.size) : "" }),
      h("td", { text: e.modified ? V.fmtDate(e.modified) : "" }));
    if (selected && selected.path === e.path) tr.className = "selected";
    return tr;
  }

  function render(d) {
    if (!d) return;
    if (d.path !== undefined) cwd = d.path;
    readOnly = !!d.read_only;
    crumbs();
    var rows = V.clear(V.$("#rows")), list = d.entries || d.results || [];
    list.forEach(function (e) { rows.appendChild(row(e)); });
    if (!list.length) rows.appendChild(h("tr", null, h("td", { colspan: 3, class: "muted", text: d.results ? "Nothing found." : "Empty folder." })));
    if (d.truncated) V.status("Showing the first " + list.length + " entries.");
  }

  function open(path) {
    selected = null; clearPreview();
    return V.run("list", { path: path }, "Opening…").then(render);
  }

  function hideAll() {
    ["#preview", "#image", "#editor", "#save", "#cancel", "#edit", "#show-versions", "#trash", "#version-note", "#versions-box"]
      .forEach(function (sel) { V.$(sel).hidden = true; });
    V.$("#image").removeAttribute("src");
  }

  function clearPreview() {
    hideAll(); current = null;
    V.$("#pname").textContent = ""; V.$("#pinfo").textContent = "";
  }

  function showImage(r) {
    var img = V.$("#image");
    img.src = "data:" + r.mime + ";base64," + r.data;
    img.alt = selected ? selected.name : "";
    img.hidden = false;
  }

  function showText(text) { var pre = V.$("#preview"); pre.textContent = text; pre.hidden = false; }

  // Show the current content of the selected file: a picture for images, text otherwise.
  function preview(e) {
    selected = e; hideAll(); current = null;
    V.$("#pname").textContent = e.name;
    var writable = !readOnly && e.path.includes("/");
    V.$("#trash").hidden = !writable;
    V.$("#show-versions").hidden = !writable;
    var image = IMAGE.test(e.name), svg = /\.svg$/i.test(e.name);
    var shown = image ? V.run("read_image", { path: e.path }, "Loading…").then(function (r) { if (r) { showImage(r); V.$("#pinfo").textContent = V.fmtBytes(r.size); } })
                      : Promise.resolve();
    return shown.then(function () {
      if (image && !svg) return;  // raster images are not editable as text
      return V.run("read", { path: e.path }, image ? null : "Reading…").then(function (r) {
        if (!r) return;
        current = r;
        if (!image) showText(r.text);
        V.$("#pinfo").textContent = V.fmtBytes(r.size) + (r.truncated ? " · too large to show in full" : "");
        V.$("#edit").hidden = !writable || r.truncated;
      });
    });
  }

  function edit() {
    if (!current) return;
    hideAll();
    var ed = V.$("#editor");
    ed.value = current.text; ed.hidden = false; ed.focus();
    V.$("#save").hidden = false; V.$("#cancel").hidden = false;
  }

  function save() {
    var text = V.$("#editor").value, path = selected.path;
    V.run("write", { path: path, content: text, overwrite: true }, "Saving…").then(function (r) {
      if (!r) return;
      V.status("Saved " + path + ". The previous content is kept under Versions.");
      preview(selected);
    });
  }

  function showVersions() {
    V.run("versions", { path: selected.path }, "Loading versions…").then(function (d) {
      if (!d) return;
      var list = V.clear(V.$("#versions"));
      if (!d.versions.length) list.appendChild(h("li", { class: "muted", text: "No earlier versions yet: they appear after the first save." }));
      d.versions.forEach(function (v) {
        list.appendChild(h("li", null,
          h("span", { text: V.fmtDate(v.saved) + " · " + V.fmtBytes(v.size) }),
          h("button", { type: "button", class: "linklike", text: "View", onclick: function () { viewVersion(v); } }),
          h("button", { type: "button", text: "Restore", onclick: function () { restore(v); } })));
      });
      V.$("#versions-box").hidden = false;
    });
  }

  function viewVersion(v) {
    V.run("read_version", { path: selected.path, version_id: v.version_id }, "Loading…").then(function (r) {
      if (!r) return;
      V.$("#preview").hidden = true; V.$("#image").hidden = true; V.$("#editor").hidden = true;
      V.$("#save").hidden = true; V.$("#cancel").hidden = true;
      if (r.data) showImage(r);
      else if (/\.svg$/i.test(selected.name)) showImage({ mime: "image/svg+xml", data: btoa(unescape(encodeURIComponent(r.text))) });
      else showText(r.text);
      var note = V.$("#version-note");
      note.textContent = "Version saved " + V.fmtDate(v.saved) + " (not the current content).";
      note.hidden = false;
    });
  }

  function restore(v) {
    V.run("restore", { path: selected.path, version_id: v.version_id }, "Restoring…").then(function (r) {
      if (!r) return;
      V.status("Restored the version from " + V.fmtDate(v.saved) + ". The content it replaced is kept under Versions.");
      preview(selected).then(showVersions);
    });
  }

  V.$("#up").addEventListener("click", function () { open(cwd.split("/").slice(0, -1).join("/")); });
  V.$("#refresh").addEventListener("click", function () { open(cwd); });
  V.$("#edit").addEventListener("click", edit);
  V.$("#save").addEventListener("click", save);
  V.$("#cancel").addEventListener("click", function () { preview(selected); });
  V.$("#show-versions").addEventListener("click", showVersions);
  V.$("#trash").addEventListener("click", function () {
    if (!selected) return;
    var name = selected.path;
    V.run("trash", { path: name }, "Moving to trash…").then(function (r) {
      if (r) { open(cwd).then(function () { V.status("Moved " + name + " to the trash. Undo restores it."); }); }
    });
  });
  V.$("#undo").addEventListener("click", function () {
    V.run("undo", {}, "Undoing…").then(function (r) {
      if (r) open(cwd).then(function () { V.status("Undid " + r.undone.op + " of " + r.undone.path + "."); });
    });
  });
  V.onSubmit(V.$("#search"), function () {
    var q = V.$("#q").value.trim(), c = V.$("#c").value.trim();
    if (!q && !c) return;
    var args = { query: q, path: cwd };
    if (c) args.content = c;
    V.run("search", args, "Searching…").then(function (d) { if (d) { render({ path: cwd, results: d.results, truncated: d.truncated }); } });
  });
  V.start({ name: "foyelle-files-browser", render: render, load: function () { return open(""); } });
})();
</script>
</body>
</html>
