[project]
name = "foyelle-connectors"
version = "0.1.0"
description = "First-party MCP connectors for Foyelle (shell, files, email, calendar, web, system)"
license = "MIT"
requires-python = ">=3.13"
# Keep in step with nixpkgs: mcp 1.27.1, httpx 0.28.1, caldav 3.2.1,
# icalendar 7.2.0, uvicorn 0.51.0. Starlette comes in through mcp.
dependencies = [
    "mcp>=1.27.1,<2",
    "httpx>=0.28.1,<0.29",
    "caldav>=3.2.1,<4",
    "icalendar>=7.2.0,<8",
    "uvicorn>=0.51.0",
]

[project.scripts]
foyelle-connector-shell = "foyelle_connectors.shell.server:main"
foyelle-connector-files = "foyelle_connectors.files.server:main"
foyelle-connector-email = "foyelle_connectors.email.server:main"
foyelle-connector-calendar = "foyelle_connectors.calendar.server:main"
foyelle-connector-web = "foyelle_connectors.web.server:main"
foyelle-connector-system = "foyelle_connectors.system.server:main"
foyelle-connector-workshop = "foyelle_connectors.workshop.server:main"
foyelle-connector-bridge = "foyelle_connectors.bridge.server:main"

[dependency-groups]
dev = [
    "mcp==1.27.1",
    "httpx==0.28.1",
    "caldav==3.2.1",
    "icalendar==7.2.0",
    "uvicorn==0.51.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foyelle_connectors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
